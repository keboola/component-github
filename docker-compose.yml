# Sync note: tracks cookiecutter-python-component — update when template changes
# Do not change: KBC_DATADIR=./data, service structure.
version: "2"
services:
  # for development purposes
  dev:
    build: .
    volumes:
      - ./:/code
      - ./data:/data
    environment:
      - KBC_DATADIR=./data
  test:
    # Runs ruff lint + format check + pytest via uv (see scripts/build_n_test.sh)
    build: .
    volumes:
      - ./:/code
      - ./data:/data
    environment:
      - KBC_DATADIR=./data
    command:
      - /bin/sh
      - /code/scripts/build_n_test.sh
